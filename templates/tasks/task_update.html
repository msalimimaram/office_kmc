{% extends "base.html" %}{% block title %}وضعیت وظیفه{% endblock %}
{% block content %}<section class="panel narrow"><p class="eyebrow">پیگیری وظیفه</p><h1>{{ task.title }}</h1><p>{{ task.description }}</p><p class="muted">اولویت: {{ task.get_priority_display }} · مهلت: {{ task.due_at|default:"—" }}</p><form method="post">{% csrf_token %}<label>وضعیت</label><select name="status">{% for key,label in task.Status.choices %}<option value="{{ key }}" {% if task.status == key %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button class="btn primary">به‌روزرسانی وضعیت</button></form></section>{% endblock %}
